# Runs the engine tests on Windows, macOS and Linux for every change. Nobody on the team needs those machines.
name: Tests

on:
  push:
  pull_request:

jobs:
  engine:
    name: Engine tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  window:
    name: Window code checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install without downloading binaries
        working-directory: app
        run: npm ci --ignore-scripts
      - name: Check JavaScript syntax
        working-directory: app
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer/app.js
          node --check renderer/mock.js
