[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healvideo"
version = "0.1.0"
description = "Diagnose and repair corrupted video files, including cards with scattered (fragmented) files."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = []  # standard library only; FFmpeg and untrunc run as separate programs

[project.optional-dependencies]
dev = ["pytest>=7"]
build = ["pyinstaller>=6"]

[project.scripts]
healvideo = "healvideo.cli:main"

[tool.setuptools]
packages = ["healvideo"]

[tool.setuptools.package-data]
healvideo = ["profiles/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
